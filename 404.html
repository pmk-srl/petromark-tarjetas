<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarjeta no disponible — Petromark SRL</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141210">
<link rel="icon" href="/petromark-tarjetas/img/escudo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --celeste: #00a8d4; --negro: #141210; --plata: #bdbbbe; --gris-texto: #6b6b6e; --blanco: #ffffff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    background: var(--negro); color: var(--blanco);
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 24px; -webkit-font-smoothing: antialiased;
  }
  .caja { text-align: center; max-width: 360px; border-left: 5px solid var(--celeste); padding-left: 24px; text-align: left; }
  .marca { display: flex; align-items: baseline; gap: 6px; margin-bottom: 18px; }
  .marca .pm { font-family: 'Anton', 'Arial Narrow', sans-serif; font-size: 28px; letter-spacing: 0.02em; line-height: 1; }
  .marca .srl { font-size: 12px; font-weight: 600; letter-spacing: 0.18em; color: var(--celeste); }
  h1 { font-family: 'Anton', 'Arial Narrow', sans-serif; font-size: 22px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.01em; margin: 0 0 10px; }
  p { margin: 0 0 22px; font-size: 14.5px; line-height: 1.5; color: var(--plata); }
  a.boton {
    display: inline-flex; align-items: center; gap: 10px;
    min-height: 48px; padding: 0 20px; border-radius: 12px;
    background: var(--celeste); color: var(--negro);
    font-weight: 600; font-size: 15px; text-decoration: none;
  }
  a.boton svg { width: 18px; height: 18px; stroke: currentColor; }
  a.boton:focus-visible { outline: 2px solid var(--blanco); outline-offset: 2px; }
  .pie { margin-top: 28px; font-size: 11px; letter-spacing: 0.04em; color: var(--gris-texto); }
</style>
</head>
<body>
  <main class="caja">
    <div class="marca"><span class="pm">PETROMARK</span><span class="srl">SRL</span></div>
    <h1>Tarjeta no disponible</h1>
    <p>Esta tarjeta ya no está activa o la dirección no es correcta. Podés contactarnos desde nuestro sitio.</p>
    <a class="boton" href="https://www.petromark.com.ar">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      Ir a petromark.com.ar
    </a>
    <div class="pie">Neuquén, Argentina · Powered by I+D - PMK</div>
  </main>
</body>
</html>
